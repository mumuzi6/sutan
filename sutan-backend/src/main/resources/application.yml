server:
  port: 8080

spring:
  application:
    name: sutan-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sutan}
    username: ${DB_USER:sutan}
    password: ${DB_PASSWORD:sutan}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  ai:
    model:
      chat: deepseek
      embedding: openai
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
          temperature: 0.3
    # OpenAI 兼容 embedding：指向 SiliconFlow 托管的 BGE-M3（1024 维，中文强）
    openai:
      api-key: ${EMBEDDING_API_KEY:sk-placeholder}
      base-url: ${EMBEDDING_BASE_URL:https://api.siliconflow.cn/v1}
      embedding:
        options:
          model: ${EMBEDDING_MODEL:BAAI/bge-m3}
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1024
        initialize-schema: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    com.mumuzi.sutan: INFO
    org.springframework.ai: INFO
