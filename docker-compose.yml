services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sutan-postgres
    environment:
      POSTGRES_USER: sutan
      POSTGRES_PASSWORD: sutan
      POSTGRES_DB: sutan
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sutan"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: sutan-backend/Dockerfile
    container_name: sutan-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: sutan
      DB_USER: sutan
      DB_PASSWORD: sutan
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
